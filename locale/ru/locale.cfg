energy-combinator-round-current-production=Округление текущей выработки после масштабирования по X. По умолчанию: до ближайшего целого. Общее для всех комбинаторов на карте.
energy-combinator-round-maximum-consumption=Округление расчётного максимального потребления после масштабирования по X. По умолчанию: вверх. Общее для всех комбинаторов на карте.
