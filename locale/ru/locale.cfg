[tips-and-tricks-item-name]
power-combinator=Комбинатор мощностей

[tips-and-tricks-item-description]
power-combinator=Этот тип комбинатора выводит статистику потребляемых и вырабатываемых мощностей электрической сети в ваттах в виде сигналов для сетей комбинаторов.\nДля подключëнной электрической сети предоставляются следующие уникальные сигналы\n [virtual-signal=power-factor]: внутренний коэффициент предварительного масштабирования X как [font=default-bold]настройка пользователя комбинатора[/font] для всех значений, отправляемых в сеть комбинаторов\n [virtual-signal=power-consumption]: текущее потребление (Вт)\n [virtual-signal=power-production]: текущая производительность (Вт)\n [virtual-signal=power-max-consumption]: максимально возможное потребление (Вт)\n [virtual-signal=power-max-production]: максимально возможная производительность (Вт)\n\nЕсли выходные значения превышают шкалу 2³¹, то выход комбинатора не обновляет статистику, а индикатор в правом нижнем углу горит красным светом. В этом случае установите коэффициент масштабирования на разумное значение.

