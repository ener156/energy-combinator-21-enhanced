power-max-production=Максимально возможное производство энергии
power-factor=Коэффициент масштаба X

[virtual-signal-description]
power-factor=Коэффициент X определяет единицы измерения сигналов мощности, но не изменяет реальное потребление или производство энергии.\nОдна единица сигнала соответствует:\nX=0  |  1 Вт\nX=1  |  10 Вт\nX=2  |  100 Вт\nX=3  |  1 кВт\nX=4  |  10 кВт\nX=5  |  100 кВт\nX=6  |  1 МВт\n\nСигнал = мощность в ваттах / 10^X; по умолчанию текущие показания округляются до ближайшего целого, максимальное потребление — вверх, максимальная выработка — вниз. Все четыре способа округления можно менять отдельно в настройках карты. Пример: 20 кВт дают сигнал 20 при X=3 и 200 при X=2.\nМеньший X = выше точность; больший X = меньше числа. После изменения X обновите пороги логической схемы.

