[entity-description]
power-combinator=Показывает статистику электрической сети.\nКоэффициент X масштабирует сигналы мощности. Таблица доступна в подсказке к сигналу X и в разделе «Советы и подсказки».
power-combinator-MK2=Показывает статистику электрической сети для каждого типа здания c подключённого логичекого провода.\nКоэффициент X масштабирует сигналы мощности. Таблица доступна в подсказке к сигналу X и в разделе «Советы и подсказки».
power-combinator-meter-network=Подключение комбинатора мощностей к электрической сети. Используется для мониторинга статистики электрической сети.
power-combinator-meter-satisfaction=Датчик для измерения удовлетворённости подключённой электрической сети. Не имеет собственного потребления.

[technology-name]
