[mod-name]
power-combinator=Комбинатор мощностей

[mod-description]
power-combinator=Имейте потребляемые и вырабатываемые мощности в виде сигналов в вашей комбинаторной сети с возможностью измерения статистики подключённой электрической сети примерно до 1,8 × 10^308 Вт. Также предусмотрены дополнительные сигналы огибающей для максимально прогнозируемого производства/потребления электроэнергии. Мы используем идентификатор электрической сети для учёта всех расчётных значений в каждой электрической сети.

