[tips-and-tricks-item-name]
power-combinator=Комбинатор мощностей

[tips-and-tricks-item-description]
power-combinator=Этот тип комбинатора выводит статистику потребляемых и вырабатываемых мощностей электрической сети в ваттах в виде сигналов для сетей комбинаторов.\nДля подключëнной электрической сети предоставляются следующие уникальные сигналы\n [virtual-signal=power-factor]: внутренний коэффициент предварительного масштабирования X как [font=default-bold]настройка пользователя комбинатора[/font] для всех значений, отправляемых в сеть комбинаторов\n [virtual-signal=power-consumption]: текущее потребление (Вт)\n [virtual-signal=power-production]: текущая производительность (Вт)\n [virtual-signal=power-max-consumption]: максимально возможное потребление (Вт)\n [virtual-signal=power-max-production]: максимально возможная производительность (Вт)\n\nЕсли выходные значения превышают шкалу 2³¹, то выход комбинатора не обновляет статистику, а индикатор в правом нижнем углу горит красным светом. В этом случае установите коэффициент масштабирования на разумное значение.\n\n[font=default-bold]Коэффициент масштаба X – единицы сигнала[/font]\nX=0  |  1 Вт\nX=1  |  10 Вт\nX=2  |  100 Вт\nX=3  |  1 кВт\nX=4  |  10 кВт\nX=5  |  100 кВт\nX=6  |  1 МВт\n\nСигнал = мощность в ваттах / 10^X; по умолчанию текущие показания округляются до ближайшего целого, максимальное потребление — вверх, максимальная выработка — вниз. Все четыре способа округления можно менять отдельно в настройках карты. Пример: 20 кВт дают сигнал 20 при X=3 и 200 при X=2.\nX=3 (1 кВт на единицу сигнала) – удобное значение. X не влияет на реальный расход энергии.\nМеньший X = выше точность; больший X = меньше числа. После изменения X обновите пороги логической схемы.

