power-max-production=Maximale Stromerzeugung
power-factor=Skalierungsfaktor X

[virtual-signal-description]
power-factor=Faktor X bestimmt die Einheit der Leistungssignale, nicht den tatsächlichen Stromverbrauch oder die Stromerzeugung.\nEin Signalpunkt entspricht:\nX=0  |  1 W\nX=1  |  10 W\nX=2  |  100 W\nX=3  |  1 kW\nX=4  |  10 kW\nX=5  |  100 kW\nX=6  |  1 MW\n\nSignal = Leistung in Watt / 10^X; aktuelle Messwerte werden auf die nächste ganze Zahl gerundet. Beispiel: 20 kW ergeben bei X=3 den Signalwert 20, bei X=2 den Wert 200.\nKleineres X = genauere Auflösung; größeres X = kleinere Zahlen. Bei Änderungen Vergleichsschwellen in Schaltungen anpassen.

[mod-setting-name]
power-combinator-update-tick=Aktualisierungsrate

[mod-setting-description]
power-combinator-update-tick=Aktualisierung bei jedem n-ten Tick.\nDeaktiviert: 0, Standard: 5

[tips-and-tricks-item-name]
power-combinator=Kombinator für Stromleistung

[tips-and-tricks-item-description]
power-combinator=Dieser Kombinator gibt Statistiken über Stromverbrauch und Stromerzeugung eines Stromnetzwerkes in Watt als Signale an das angeschlossene Schaltungsnetz aus.\nFür das angeschlossene Stromnetz werden folgende eindeutige Signale bereitgestellt\n [virtual-signal=power-factor]: interner Vorskalierungsfaktor X als [font=default-bold]benutzerdefinierte Signaleinstellung[/font] für alle an das Schaltungsnetz gesendeten Werte\n [virtual-signal=power-consumption]: aktueller Leistungsverbrauch (W)\n [virtual-signal=power-production]: aktuelle Leistungserzeugung (W)\n [virtual-signal=power-max-consumption]: maximal möglicher Leistungsverbrauch (W)\n [virtual-signal=power-max-production]: maximal mögliche Leistungserzeugung (W)\n\nWenn die Ausgabewerte über der Skala von 2³¹ liegen, dann aktualisiert die Ausgabe des Kombinators die Statistiken nicht und die Anzeigelampe in der rechten unteren Ecke leuchtet rot. Stellen Sie in diesem Fall den Skalierungsfaktor bitte auf einen sinnvollen Wert ein.\n\n[font=default-bold]Skalierungsfaktor X – Einheit je Signalpunkt[/font]\nX=0  |  1 W\nX=1  |  10 W\nX=2  |  100 W\nX=3  |  1 kW\nX=4  |  10 kW\nX=5  |  100 kW\nX=6  |  1 MW\n\nSignal = Leistung in Watt / 10^X; aktuelle Messwerte werden auf die nächste ganze Zahl gerundet. Beispiel: 20 kW ergeben bei X=3 den Signalwert 20, bei X=2 den Wert 200.\nX=3 (1 kW je Signalpunkt) ist ein guter Standard. X verändert nicht den tatsächlichen Strombedarf.\nKleineres X = genauere Auflösung; größeres X = kleinere Zahlen. Bei Änderungen Vergleichsschwellen in Schaltungen anpassen.

