[tips-and-tricks-item-name]
power-combinator=Kombinator für Stromleistung

[tips-and-tricks-item-description]
power-combinator=Dieser Kombinator gibt Statistiken über Stromverbrauch und Stromerzeugung eines Stromnetzwerkes in Watt als Signale an das angeschlossene Schaltungsnetz aus.\nFür das angeschlossene Stromnetz werden folgende eindeutige Signale bereitgestellt\n [virtual-signal=power-factor]: interner Vorskalierungsfaktor X als [font=default-bold]benutzerdefinierte Signaleinstellung[/font] für alle an das Schaltungsnetz gesendeten Werte\n [virtual-signal=power-consumption]: aktueller Leistungsverbrauch (W)\n [virtual-signal=power-production]: aktuelle Leistungserzeugung (W)\n [virtual-signal=power-max-consumption]: maximal möglicher Leistungsverbrauch (W)\n [virtual-signal=power-max-production]: maximal mögliche Leistungserzeugung (W)\n\nWenn die Ausgabewerte über der Skala von 2³¹ liegen, dann aktualisiert die Ausgabe des Kombinators die Statistiken nicht und die Anzeigelampe in der rechten unteren Ecke leuchtet rot. Stellen Sie in diesem Fall den Skalierungsfaktor bitte auf einen sinnvollen Wert ein.\n\n[font=default-bold]Skalierungsfaktor X – Einheit je Signalpunkt[/font]\nX=0  |  1 W\nX=1  |  10 W\nX=2  |  100 W\nX=3  |  1 kW\nX=4  |  10 kW\nX=5  |  100 kW\nX=6  |  1 MW\n\nSignal = Leistung in Watt / 10^X; standardmäßig werden aktuelle Messwerte mathematisch, Maximalverbrauch aufwärts und maximale Erzeugung abwärts gerundet. Alle vier Rundungen sind in den Mod-Einstellungen der Karte einzeln wählbar. Beispiel: 20 kW ergeben bei X=3 den Signalwert 20, bei X=2 den Wert 200.\nX=3 (1 kW je Signalpunkt) ist ein guter Standard. X verändert nicht den tatsächlichen Strombedarf.\nKleineres X = genauere Auflösung; größeres X = kleinere Zahlen. Bei Änderungen Vergleichsschwellen in Schaltungen anpassen.

