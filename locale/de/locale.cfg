[virtual-signal-description]
power-factor=Faktor X bestimmt die Einheit der Leistungssignale, nicht den tatsächlichen Stromverbrauch oder die Stromerzeugung.\nEin Signalpunkt entspricht:\nX=0  |  1 W\nX=1  |  10 W\nX=2  |  100 W\nX=3  |  1 kW\nX=4  |  10 kW\nX=5  |  100 kW\nX=6  |  1 MW\n\nSignal = Leistung in Watt / 10^X; standardmäßig werden aktuelle Messwerte mathematisch, Maximalverbrauch aufwärts und maximale Erzeugung abwärts gerundet. Alle vier Rundungen sind in den Mod-Einstellungen der Karte einzeln wählbar. Beispiel: 20 kW ergeben bei X=3 den Signalwert 20, bei X=2 den Wert 200.\nKleineres X = genauere Auflösung; größeres X = kleinere Zahlen. Bei Änderungen Vergleichsschwellen in Schaltungen anpassen.

