[mod-name]
power-combinator=Kombinator für Stromleistung

[mod-description]
power-combinator=Haben Sie Stromverbrauch und Stromerzeugung als Signale in Ihrem Leitungsnetzwerk, mit Funktionen zum Messen der elektrischen Netzwerkstatistiken bis zu etwa 1,8 × 10^308 Watt. Zusätzliche Hüllkurvensignale für die maximal prognostizierte Stromerzeugung/-verbrauch werden ebenfalls bereitgestellt. Wir verwenden die Stromnetz-ID zur Berechnung der Werte innerhalb dieses Stromnetzes.

