[mod-setting-description]
energy-combinator-show-alt-units=Zeigt die momentan eingestellte Leistungseinheit (z. B. kW, 100 kW, MW) direkt am Energy Combinator im ALT-Modus.
energy-combinator-round-current-consumption=Rundung des aktuellen Verbrauchssignals nach Anwendung des Skalierungsfaktors X. Standard: mathematisch. Gilt für alle Kombinatoren auf dieser Karte.
energy-combinator-round-current-production=Rundung des aktuellen Erzeugungssignals nach Anwendung des Skalierungsfaktors X. Standard: mathematisch. Gilt für alle Kombinatoren auf dieser Karte.
energy-combinator-round-maximum-consumption=Rundung des geschätzten maximalen Verbrauchssignals nach Anwendung von X. Standard: aufrunden. Gilt für alle Kombinatoren auf dieser Karte.
energy-combinator-round-maximum-production=Rundung des geschätzten maximalen Erzeugungssignals nach Anwendung von X. Standard: abrunden. Gilt für alle Kombinatoren auf dieser Karte.
power-combinator-update-tick=Aktualisierung bei jedem n-ten Tick.\nDeaktiviert: 0, Standard: 5

