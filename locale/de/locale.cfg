[entity-description]
power-combinator=Stellt Statistiken zum Stromnetz bereit.\nFaktor X skaliert die Leistungssignale. Die Tabelle findest du im Tooltip des Signals „Skalierungsfaktor X“ und unter Tipps & Tricks.
power-combinator-MK2=Stellt Statistiken zum Stromnetz für ausgewähltes Bauwerk bereit.\nFaktor X skaliert die Leistungssignale. Die Tabelle findest du im Tooltip des Signals „Skalierungsfaktor X“ und unter Tipps & Tricks.
power-combinator-meter-network=Verbindung des Kombinators für Stromleistung zum Stromnetz. Wird zur Überwachung der Statistik des Netzwerkes verwendet.
power-combinator-meter-satisfaction=Sensor zum messen der Bedarfdeckung im angeschlossenen Stromnetz. Hat kein Eigenverbrauch.

