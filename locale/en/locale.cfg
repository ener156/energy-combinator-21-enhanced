[tips-and-tricks-item-name]
power-combinator=Power Combinator

[tips-and-tricks-item-description]
power-combinator=This combinator type outputs statistics of power consumption and power production in an electric network in watts as signals.\nFor the connected electric network following unique signals are provided\n [virtual-signal=power-factor]: internal prescaling factor X as [font=default-bold]user configurable combinator setting[/font] for all values sent to the combinators network\n [virtual-signal=power-consumption]: current consumption rate (W)\n [virtual-signal=power-production]: current production rate (W)\n [virtual-signal=power-max-consumption]: maximal possible consumption rate (W)\n [virtual-signal=power-max-production]: maximal possible production rate (W)\n\nIf the output values are over the scale of 2³¹ then the combinator output doesn't update the stats and the indicator light in right bottom corner will show red light. In this case please set the scaling factor to a reasonable value.

