[tips-and-tricks-item-name]
power-combinator=Power Combinator

[tips-and-tricks-item-description]
power-combinator=This combinator type outputs statistics of power consumption and power production in an electric network in watts as signals.\nFor the connected electric network following unique signals are provided\n [virtual-signal=power-factor]: internal prescaling factor X as [font=default-bold]user configurable combinator setting[/font] for all values sent to the combinators network\n [virtual-signal=power-consumption]: current consumption rate (W)\n [virtual-signal=power-production]: current production rate (W)\n [virtual-signal=power-max-consumption]: maximal possible consumption rate (W)\n [virtual-signal=power-max-production]: maximal possible production rate (W)\n\nIf the output values are over the scale of 2³¹ then the combinator output doesn't update the stats and the indicator light in right bottom corner will show red light. In this case please set the scaling factor to a reasonable value.\n\n[font=default-bold]Scaling factor X – unit per signal point[/font]\nX=0  |  1 W\nX=1  |  10 W\nX=2  |  100 W\nX=3  |  1 kW\nX=4  |  10 kW\nX=5  |  100 kW\nX=6  |  1 MW\n\nSignal = power in watts / 10^X; by default, current measurements round to the nearest integer, maximum consumption rounds up and maximum production rounds down. All four rounding modes can be changed separately in map mod settings. Example: 20 kW gives signal 20 at X=3, or 200 at X=2.\nX=3 (1 kW per signal point) is a useful default. X does not change actual electricity demand.\nSmaller X = finer resolution; larger X = smaller numbers. Adjust circuit thresholds after changing X.

