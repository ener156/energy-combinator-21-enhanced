[mod-name]
power-combinator=Power Combinator

[mod-description]
power-combinator=Have power consumption and power production as signals in your circuit network, with capabilities to measure the electric network statistics up to about 1.8 × 10^308 watts. Additional envelope signals for maximal projected electric production/consumption are also provided. We use the electric network id for accounting of all calculated values within each electric network.

