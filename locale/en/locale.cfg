[mod-setting-description]
energy-combinator-show-alt-units=Show the selected power unit (e.g. kW, 100 kW, MW) above the Energy Combinator in ALT mode.
energy-combinator-round-current-consumption=Round the current consumption signal after scaling by X. Default: nearest integer. Shared by all combinators on this map.
energy-combinator-round-current-production=Round the current production signal after scaling by X. Default: nearest integer. Shared by all combinators on this map.
energy-combinator-round-maximum-consumption=Round the estimated maximum consumption signal after scaling by X. Default: up. Shared by all combinators on this map.
energy-combinator-round-maximum-production=Round the estimated maximum production signal after scaling by X. Default: down. Shared by all combinators on this map.
power-combinator-update-tick=Update signals every n-th tick.\ndisabled: 0, default: 5

