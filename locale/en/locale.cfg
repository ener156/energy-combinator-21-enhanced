[entity-description]
power-combinator=Provides electric network statistics.\nFactor X scales power signals. See the Scaling factor X signal tooltip and Tips & Tricks for the conversion table.
power-combinator-MK2=Provides electric network statistics for each building type from connected circuit wire.\nFactor X scales power signals. See the Scaling factor X signal tooltip and Tips & Tricks for the conversion table.
power-combinator-meter-network=Connection of power combinator to the electric network. Used to monitor electric network statistics.
power-combinator-meter-satisfaction=Sensor for measuring satisfaction of the connected electric network. Has no own consumption.

