power-consumption=Power Consumption
power-production=Power Production
power-max-consumption=Maximal Power Consumption
power-max-production=Maximal Power Production
power-factor=Scaling factor X

[virtual-signal-description]
power-factor=Factor X selects the unit of the power signals, not actual electricity consumption or production.\nOne signal point represents:\nX=0  |  1 W\nX=1  |  10 W\nX=2  |  100 W\nX=3  |  1 kW\nX=4  |  10 kW\nX=5  |  100 kW\nX=6  |  1 MW\n\nSignal = power in watts / 10^X; by default, current measurements round to the nearest integer, maximum consumption rounds up and maximum production rounds down. All four rounding modes can be changed separately in map mod settings. Example: 20 kW gives signal 20 at X=3, or 200 at X=2.\nSmaller X = finer resolution; larger X = smaller numbers. Adjust circuit thresholds after changing X.

