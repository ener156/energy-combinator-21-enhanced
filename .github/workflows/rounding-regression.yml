name: Rounding regression
on:
  push:
    branches:
      - 'work/1.2.6-maxprod-float-boundary'
    paths:
      - 'control.lua'
      - 'power_rounding.lua'
      - 'tests/power_rounding_test.lua'
      - 'info.json'
      - '.github/workflows/rounding-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lua-rounding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
      - name: Run actual Lua regression tests
        run: lua5.4 tests/power_rounding_test.lua
      - name: Ensure the new helper is used in game logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          assert json.loads(Path("info.json").read_text())["version"] == "1.2.6"
          control = Path("control.lua").read_text()
          assert 'require "power_rounding"' in control
          assert 'power_rounding.floor_maximum_production(maxout * 60 * scale)' in control
          assert 'ceil(maxin * 60 * scale)' in control
          print("EC126_CONTROL_INTEGRATION=PASS")
          PY
